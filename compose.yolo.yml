# Web demo. Prepare the bundle and thumbnails once, then start:
#
#   scripts/setup_demo.sh /path/to/dataset demo
#   docker compose --env-file demo/yolo.env -f compose.yolo.yml up -d
#
# Open http://127.0.0.1:27816/ (port: LCT_API_PORT).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    image: ${LCT_YOLO_IMAGE:-lct26-street-falcon-reid:yolo}
    restart: unless-stopped
    read_only: true
    init: true
    user: "${LOCAL_UID:-1009}:${LOCAL_GID:-1009}"
    cpus: 2
    mem_limit: 3g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LCT_YOLO_BUNDLE: /bundle
      LCT_THUMBNAIL_DIR: /thumbnails
      LCT_DEVICE: cpu
    volumes:
      - ${LCT_YOLO_BUNDLE:?Set YOLO bundle directory}:/bundle:ro
      - ${LCT_THUMBNAIL_DIR:?Set thumbnails directory}:/thumbnails:ro
    ports:
      - 127.0.0.1:${LCT_API_PORT:-27816}:8080
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
