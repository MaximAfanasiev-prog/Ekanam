[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "street-falcon-reid"
version = "0.1.0"
description = "Reproducible vehicle re-identification baseline for LCT 2026"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy==2.1.3",
  "pillow==11.0.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "ruff==0.9.7",
]

[project.scripts]
street-falcon-reid = "street_falcon_reid.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
street_falcon_reid = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
