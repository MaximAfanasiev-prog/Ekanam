# One-command offline inference:
#
#   FALCON_DATASET_DIR=/path/to/dataset docker compose up --build
#
# FALCON_DATASET_DIR must contain test_query.csv, test_gallery.csv and images/ (default: ./dataset).
# Results go to OUTPUT_DIR (default: ./output). The container runs as root unless DOCKER_USER is set, e.g.
# DOCKER_USER=$(id -u):$(id -g), so that the output files belong to you. Without an NVIDIA GPU use the CPU variant:
#
#   docker compose --profile cpu up --build inference-cpu

x-inference: &inference
  build: .
  image: falcon-reid-inference:latest
  user: ${DOCKER_USER:-0:0}
  network_mode: none  # no internet at run time: weights and packages are inside the image
  volumes:
    - ${FALCON_DATASET_DIR:-./dataset}:/data:ro
    - ${OUTPUT_DIR:-./output}:/output

services:
  inference:
    <<: *inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  inference-cpu:
    <<: *inference
    profiles: [cpu]
    command: ["--refuse-rate", "0.25", "--rerank", "--device", "cpu"]
